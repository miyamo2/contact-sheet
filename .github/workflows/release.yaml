name: Release

# Nothing in the tree names the version. The tag is the version: the composite
# action installs the release matching the ref it was pinned to, and the binary
# reads its own version out of the build information Go stamps in from that same
# tag. So a release is a tag and a build, with no commit in front of it.
#
# There is no moving major tag. `main` is what the README points at and what
# branch protection covers, and a release tag is immutable; a `v1` that every
# release force-pushes to a new commit would be the one ref here that neither of
# those protects, and nothing points at it any more.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v1.2.3
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a vMAJOR.MINOR.PATCH version"
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      # goreleaser builds from this tag, and -buildvcs=true is what puts it in
      # the binary; the tag has to exist on the commit before the build runs
      - name: Tag the commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${VERSION}" -m "${VERSION}"
          git push origin "${VERSION}"

      - name: Build and publish
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
