name: Release

# The version the composite action installs lives in VERSION, so a release has
# to write that file before the tag exists -- otherwise the tag would point at a
# tree asking for the previous release's binaries. The order is: bump, commit,
# tag the commit, then build.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v1.2.3
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a vMAJOR.MINOR.PATCH version"
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Pin VERSION and tag it
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "${VERSION}" > VERSION
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qam "release ${VERSION}"
          git tag -a "${VERSION}" -m "${VERSION}"
          git push origin HEAD "${VERSION}"

      - name: Build and publish
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `uses: miyamo2/contact-sheet@v1` should follow the newest v1.x, so the
      # major tag moves to the release commit once its assets exist
      - name: Move the major tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          major="${VERSION%%.*}"
          git tag -f "${major}"
          git push -f origin "${major}"
