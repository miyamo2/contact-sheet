name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./... -race
      - run: gofmt -l . | tee /dev/stderr | (! read)

      # the composite action's contract is that `contact-sheet` runs with no
      # arguments and env alone; this is the cheapest check that it still does
      - name: Render a sheet without a token
        run: |
          go build -o /tmp/contact-sheet ./cmd/contact-sheet
          CONTACT_SHEET_PATH=internal/collect/testdata/captures \
          CONTACT_SHEET_DRY_RUN=true \
            /tmp/contact-sheet

  # nothing else here parses action.yml. `go test` does not read it, and
  # dogfooding.yaml only loads it once a `/dogfooding` comment arrives, from the
  # copy of that workflow on the default branch -- so a metadata file GitHub
  # refuses to load reaches main with every tick green, and is found by the
  # first run that tries to use it. Running the action is the check
  action:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      # install.sh downloads the release named by VERSION, which does not exist
      # for a commit under review; building into the directory it installs to
      # leaves it to find its work already done, the way dogfooding.yaml does
      - name: Build the binary where the action installs one
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/contact-sheet-$(tr -d '[:space:]' < VERSION)"
          mkdir -p "${destination}"
          go build -o "${destination}/contact-sheet" ./cmd/contact-sheet

      # dry-run pushes nothing and comments nothing, so the workflow's read-only
      # token is enough and a fork's pull request runs this like any other
      - name: Load and run the composite action
        uses: ./
        with:
          path: internal/collect/testdata/captures
          layout: '^(?:[^/]+/)?(?P<screen>.+?)(?:-(?P<theme>light|dark))?\.png$'
          dry-run: 'true'

  # the list is read off the directory rather than written out here, so a new
  # template gets its own job the moment it lands
  list-templates:
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.find.outputs.names }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: find
        run: |
          shopt -s nullglob
          files=(templates/*.tmpl)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no templates in templates/" >&2
            exit 1
          fi
          names=$(printf '%s\n' "${files[@]##*/}" | jq -R . | jq -s -c .)
          echo "names=${names}" >> "${GITHUB_OUTPUT}"
          echo "${names}"

  # one check per template, named after it: a red tick says which file broke
  # without anyone opening the log
  template:
    needs: list-templates
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.list-templates.outputs.names) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      # parses and renders against all three states. -run matching nothing is a
      # pass in `go test`, so the subtest is confirmed to have actually run
      - name: Render ${{ matrix.template }} in every state
        run: |
          go test ./cmd/contact-sheet -v \
            -run "TestShippedTemplatesRender/${{ matrix.template }}" | tee /tmp/out
          grep -q "RUN   TestShippedTemplatesRender/${{ matrix.template }}" /tmp/out

      # the test parses the file; this parses whatever --template-files loads,
      # which is the path a user's workflow actually takes
      - name: Post ${{ matrix.template }} through the binary
        run: |
          go build -o /tmp/contact-sheet ./cmd/contact-sheet
          /tmp/contact-sheet --dry-run \
            --path internal/collect/testdata/captures \
            --layout '^(?:[^/]+/)?(?P<screen>.+?)(?:-(?P<theme>light|dark))?\.png$' \
            --template-files "templates/${{ matrix.template }}"

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: shellcheck scripts/install.sh
