name: Dogfooding

# The action's own pull requests get the action's own comment. `/dogfooding` on
# a pull request runs the action as it stands on that pull request against the
# captures already checked in under internal/collect/testdata, and leaves one
# comment per template -- the built-in one, and every file in templates/ -- so a
# change to a template, or to what the binary renders, is reviewed as the thing
# a reader would see rather than as a diff.
#
# A run reports itself as the `dogfooding` commit status on the pull request's
# head, so that branch protection can require it: a head nobody has run the
# command on carries the pending status this file posts when the commit appears,
# and a merge waits until a run has reported success on that exact commit. The
# rule itself is not in this repository -- it is a required status check named
# `dogfooding` on the default branch, added under Settings > Rules (or
# `gh api -X PUT repos/:owner/:repo/branches/main/protection`), and this file
# only feeds it. One consequence worth stating: pushing a commit clears the
# result, because the status belongs to the commit that was built and not to the
# pull request, so the last word on a pull request is always a run of its final
# commit.
#
# Four things worth knowing before reading further:
#
#   - issue_comment only ever runs the copy of this file on the default branch,
#     so a change to this workflow is in effect one merge after it is written;
#     everything it checks out, builds and renders does come from the pull
#     request. pull_request_target, which is what posts the pending status, runs
#     the default branch's copy too -- a pull request cannot edit the job that
#     reports on it, and that job checks nothing out.
#   - the command is restricted to a code owner or a maintainer because the job
#     builds and runs the pull request's code with a token that can write to
#     this repository. A fork's pull request is run on the same terms as any
#     other, which is the whole weight the gate carries: anyone may open one, so
#     what stands between a stranger's code and this repository's token is a
#     maintainer having read the diff and typed the command. Read one before
#     running it, and read it again if the branch moved -- the gate resolves the
#     head when the command arrives, and the result is reported for that commit
#     alone, so a push after the fact invalidates the check rather than
#     inheriting it.
#   - one comment id and one ref namespace per template. The action deletes the
#     comments its id owns that the run did not produce, so a shared id would
#     have each job deleting its siblings' comments; and the ref it pushes to is
#     named after the run, so two invocations in one run would push two
#     parentless commits to one ref and the second would be rejected.
#   - the commit in the status line is the default branch's head, because that
#     is the commit an issue_comment run is standing on. The images and the
#     templates are the pull request's.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

# a second /dogfooding while the first is still running would have two runs
# rewriting the same comments, so the second waits rather than starting. It is
# not cancelled either: a run that has already pushed its ref and written some
# of its comments is left to finish the rest. GitHub keeps one run waiting per
# group, so a third command supersedes the one still queued.
#
# the event is part of the group, and a pending status is keyed by the commit it
# is posted for: seeding a new commit has nothing to rewrite and no reason to
# queue behind the run still commenting on the previous one
concurrency:
  group: >-
    dogfooding-${{ github.event_name }}-${{ github.event.issue.number
    || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  # A required check nothing has ever reported reads as "Expected" with no run
  # to open and no hint of what is expected of anyone. This posts the context as
  # pending as soon as a commit appears, so the pull request says what is
  # missing; a run overwrites it with its own result.
  pending:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Say that this commit has not been dogfooded
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # reopening fires on a commit a run may already have reported on, and
          # a synchronize can land on a commit that was pushed once before.
          # Overwriting either with pending would ask for a rerun of something
          # that has not changed
          reported="$(gh api "repos/${REPOSITORY}/commits/${SHA}/status" \
            --jq '[.statuses[] | select(.context == "dogfooding")] | length')"
          if [[ "${reported}" -gt 0 ]]; then
            echo "dogfooding is already reported on ${SHA}; leaving it as it is"
            exit 0
          fi

          gh api --method POST "repos/${REPOSITORY}/statuses/${SHA}" \
            -f state=pending \
            -f context=dogfooding \
            -f description='comment /dogfooding on this pull request to run it' \
            --silent

  # Nothing the gate reads comes from the pull request: the roles come from the
  # API and CODEOWNERS from the default branch, because a pull request cannot be
  # allowed to nominate its own author as a code owner. The head is checked out
  # only once that has passed.
  authorize:
    # issue_comment fires on issues too, and .pull_request is set only on a
    # comment under a pull request
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request != null
      && startsWith(github.event.comment.body, '/dogfooding')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write # moves `dogfooding` to pending, pointing at this run
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      head-sha: ${{ steps.gate.outputs.head-sha }}
      templates: ${{ steps.templates.outputs.names }}
    steps:
      - name: Check the commenter and the pull request
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PULL: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          deny() {
            echo "::notice::$1"
            echo "allowed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          }

          # a maintainer is a role rather than a list. `permission` collapses
          # maintain and write into "write", so role_name is the field that can
          # tell the two apart; a commenter who is no collaborator at all is a
          # 404, which is a "no" and not an error
          role="$(gh api "repos/${REPOSITORY}/collaborators/${COMMENTER}/permission" \
            --jq '.role_name // .permission // "none"' 2> /dev/null || echo none)"

          # a code owner is a list, and the list that counts is the one on the
          # default branch, which is what this reads. Team entries (@org/team)
          # are reported rather than resolved: membership needs a token this
          # workflow does not have
          owner=false
          for file in .github/CODEOWNERS CODEOWNERS docs/CODEOWNERS; do
            content="$(gh api -H 'Accept: application/vnd.github.raw' \
              "repos/${REPOSITORY}/contents/${file}" 2> /dev/null)" || continue
            while read -r handle; do
              if [[ "${handle}" == */* ]]; then
                echo "::notice::${file}: ${handle} is a team; its members are not checked"
              elif [[ "${handle,,}" == "@${COMMENTER,,}" ]]; then
                owner=true
              fi
            done < <(sed 's/#.*//' <<< "${content}" | tr -s '[:space:]' '\n' | grep '^@' || true)
            break
          done

          echo "@${COMMENTER} is ${role} on ${REPOSITORY}; code owner: ${owner}"
          case "${role}" in
            admin | maintain) ;;
            *)
              [[ "${owner}" == true ]] \
                || deny "@${COMMENTER} is neither a maintainer nor a code owner of ${REPOSITORY}; ignoring the command"
              ;;
          esac

          # one field per line rather than a tab-separated row: a fork deleted
          # since the pull request was opened has no repository name, and `read`
          # would swallow the empty field between two tabs
          mapfile -t pull < <(gh api "repos/${REPOSITORY}/pulls/${PULL}" \
            --jq '.state, (.head.repo.full_name // ""), .head.sha')
          if [[ "${#pull[@]}" -ne 3 ]]; then
            echo "::error::could not read #${PULL}"
            exit 1
          fi

          [[ "${pull[0]}" == open ]] || deny "#${PULL} is ${pull[0]}; leaving it alone"

          # a fork is run rather than refused, so that a contributor without
          # push access can reach a mergeable state without a maintainer
          # overriding the check for them. What makes that acceptable is the
          # gate above, and it is worth being plain in the log about what the
          # gate just decided
          if [[ "${pull[1]}" != "${REPOSITORY}" ]]; then
            echo "::warning::#${PULL} comes from ${pull[1]:-a deleted fork}; @${COMMENTER} asked for its code to be built and run here"
          fi

          echo "allowed=true" >> "${GITHUB_OUTPUT}"
          echo "head-sha=${pull[2]}" >> "${GITHUB_OUTPUT}"

      # the head the gate read is the head the rest of the run builds, and the
      # commit the result is reported on. A command refused by the gate reports
      # nothing: it leaves the pending status a commit is seeded with, or the
      # result an earlier run already reached, rather than restarting a check
      # that is not going to run
      - name: Point the dogfooding status at this run
        if: steps.gate.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.gate.outputs.head-sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${REPOSITORY}/statuses/${SHA}" \
            -f state=pending \
            -f context=dogfooding \
            -f target_url="${RUN}" \
            -f description='rendering a comment per template' \
            --silent

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.gate.outputs.allowed == 'true'
        with:
          ref: ${{ steps.gate.outputs.head-sha }}

      # read off the directory the way ci.yaml reads it, so a template added by
      # the pull request gets its comment without this file being touched.
      # "default" is the built-in template, which is what an empty
      # template-files renders
      - name: List the templates to comment with
        id: templates
        if: steps.gate.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(templates/*.tmpl)
          names="$(printf '%s\n' default "${files[@]##*/}" | jq -R . | jq -s -c .)"
          echo "names=${names}" >> "${GITHUB_OUTPUT}"
          echo "${names}"

  dogfooding:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # pushes the images to refs/contact-sheet/dogfooding/*
      pull-requests: write # writes the comment, and the acknowledgement
    strategy:
      # one template failing to render is a result, not a reason to hide the
      # rest of the comments
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.authorize.outputs.templates) }}
    name: ${{ matrix.template }}
    steps:
      # the command produces nothing for a minute or two; a reaction says it was
      # picked up. Only the first job needs to leave one, and a failure to react
      # is not a reason to fail the run
      - name: Acknowledge the comment
        if: matrix.template == 'default'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMENT: ${{ github.event.comment.id }}
        run: |
          gh api --method POST "repos/${REPOSITORY}/issues/comments/${COMMENT}/reactions" \
            -f content=eyes --silent

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.head-sha }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      # no release names the commit under review, and install.sh steps aside for
      # a binary already on PATH. Putting the pull request's own there is what
      # makes the comment below its own rendering rather than the last release's
      - name: Put the pull request's binary on PATH
        run: |
          set -euo pipefail
          destination="${RUNNER_TEMP}/contact-sheet-under-test"
          mkdir -p "${destination}"
          go build -o "${destination}/contact-sheet" ./cmd/contact-sheet
          echo "${destination}" >> "${GITHUB_PATH}"

      # a template is entitled to the inputs its own documentation pairs it
      # with; the first column of a table is labelled by an input, and flat and
      # themes do not put file names in it
      - name: Settle the inputs for ${{ matrix.template }}
        id: inputs
        env:
          TEMPLATE: ${{ matrix.template }}
        run: |
          set -euo pipefail
          key="${TEMPLATE%.tmpl}"
          file=''
          [[ "${TEMPLATE}" == default ]] || file="templates/${TEMPLATE}"
          case "${key}" in
            flat) row_label=path ;;
            themes) row_label=screen ;;
            *) row_label='file name' ;;
          esac
          {
            echo "key=${key}"
            echo "file=${file}"
            echo "row_label=${row_label}"
          } >> "${GITHUB_OUTPUT}"

      - name: Comment with ${{ matrix.template }}
        uses: ./
        with:
          # the repository takes no screenshots of its own; these are the
          # captures the collector's tests run against -- two directories, a
          # light and dark sweep, and a trace.zip for the layout to filter out
          path: internal/collect/testdata/captures
          layout: '^(?:[^/]+/)?(?P<screen>.+?)(?:-(?P<theme>light|dark))?\.png$'
          template-files: ${{ steps.inputs.outputs.file }}
          title: Contact Sheet · ${{ steps.inputs.outputs.key }}
          row-label: ${{ steps.inputs.outputs.row_label }}
          comment-id: dogfooding-${{ steps.inputs.outputs.key }}
          # under refs/contact-sheet/ so that one `git ls-remote` finds these
          # alongside the real ones, and one `git push origin :ref` reclaims them
          ref-namespace: refs/contact-sheet/dogfooding/${{ steps.inputs.outputs.key }}
          pull-number: ${{ github.event.issue.number }}
          # the action skips a fork's pull request because a `pull_request`
          # run's token could not push or comment for one. This run's token is
          # this repository's, whatever the head is, so that reason does not
          # apply and the gate above has already answered the one that does
          allow-fork: 'true'

  # One status for a matrix that renders one template per job: what branch
  # protection can require is a context, and a context is either reported or it
  # is not. `needs.dogfooding.result` is already the whole matrix collapsed into
  # one word -- success only if every template got its comment, which is what
  # fail-fast: false makes worth waiting for.
  #
  # `always()` is what lets a red matrix be reported instead of skipped; the
  # authorize guard is what keeps a refused command from touching the status.
  # Its outputs survive a later failure in that job, so a gate that passed and
  # then broke on the checkout still lands as a failure on the commit rather
  # than as a pending status nobody will clear.
  report:
    needs: [authorize, dogfooding]
    if: always() && needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Report the run on ${{ needs.authorize.outputs.head-sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ needs.authorize.outputs.head-sha }}
          AUTHORIZE: ${{ needs.authorize.result }}
          DOGFOODING: ${{ needs.dogfooding.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # a matrix that never started because the gate itself broke is
          # reported as the gate's failure, not as "skipped"
          result="${DOGFOODING}"
          [[ "${AUTHORIZE}" == success ]] || result="${AUTHORIZE}"

          case "${result}" in
            success)
              state=success
              description='every template rendered and commented'
              ;;
            cancelled)
              # error rather than failure: nothing was decided about the commit,
              # and the wording should not suggest a template broke
              state=error
              description='the run was cancelled; comment /dogfooding again'
              ;;
            *)
              state=failure
              description='a template did not render; the run has the log'
              ;;
          esac

          echo "authorize=${AUTHORIZE} dogfooding=${DOGFOODING} -> ${state} on ${SHA}"
          gh api --method POST "repos/${REPOSITORY}/statuses/${SHA}" \
            -f "state=${state}" \
            -f context=dogfooding \
            -f target_url="${RUN}" \
            -f "description=${description}" \
            --silent
