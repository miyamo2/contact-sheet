version: 2
project_name: contact-sheet

before:
  hooks:
    - go mod tidy

builds:
  - id: contact-sheet
    main: ./cmd/contact-sheet
    binary: contact-sheet
    env:
      # the binary shells out to git and speaks https; neither needs cgo, and a
      # static build is what makes one artifact work across runner images
      - CGO_ENABLED=0
    flags:
      - -trimpath
      # the binary reads its own version out of the build information the
      # toolchain stamps in (runtime/debug), which for a build standing on a tag
      # is that tag -- so nothing here has to inject a version, and nothing in
      # the tree has to carry one. `true` rather than the default `auto` so that
      # a build that cannot see the repository fails here instead of shipping a
      # binary that calls itself "(devel)"
      - -buildvcs=true
    ldflags:
      - -s -w
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  # install.sh untars on every platform, so windows gets tar.gz too rather than
  # a zip that would need a second code path
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
  # the release exists before this runs -- publishing it is what started the
  # workflow -- so whoever wrote its notes wrote the ones that should stay.
  # keep-existing is already the default; it is spelled out because the release
  # existing is the normal case here rather than the exception, and because the
  # changelog below would otherwise look like it were the one being published
  mode: keep-existing
