version: 2
project_name: contact-sheet

before:
  hooks:
    - go mod tidy

builds:
  - id: contact-sheet
    main: ./cmd/contact-sheet
    binary: contact-sheet
    env:
      # the binary shells out to git and speaks https; neither needs cgo, and a
      # static build is what makes one artifact work across runner images
      - CGO_ENABLED=0
    flags:
      - -trimpath
      # the binary reads its own version out of the build information the
      # toolchain stamps in (runtime/debug), which for a build standing on a tag
      # is that tag -- so nothing here has to inject a version, and nothing in
      # the tree has to carry one. `true` rather than the default `auto` so that
      # a build that cannot see the repository fails here instead of shipping a
      # binary that calls itself "(devel)"
      - -buildvcs=true
    ldflags:
      - -s -w
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  # install.sh untars on every platform, so windows gets tar.gz too rather than
  # a zip that would need a second code path
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # a published release is immutable and takes no assets afterwards, so the
  # binaries have to be attached while the release is still a draft. This run
  # stops there: it builds, uploads, and leaves the release for a human to write
  # notes on and publish. goreleaser drafts every release it creates while it
  # uploads and undrafts it at the end; this keeps it drafted
  draft: true
  # look for the draft rather than for a release at the tag. The tag lookup the
  # API offers does not answer for drafts, so without this a draft written ahead
  # of the tag push -- notes first, tag second -- is invisible here and a second
  # draft is created beside it. Drafts are matched by title, so a draft written
  # in advance has to be titled with its tag, which is what the release page
  # fills in for you
  use_existing_draft: true
  prerelease: auto
  # so that a draft written in advance keeps the notes someone meant it to have.
  # keep-existing is already the default; it is spelled out because the draft
  # existing is a normal case here rather than an exception, and because the
  # changelog above would otherwise look like it always wins. It fills in the
  # body of a draft that has none, which is the other normal case
  mode: keep-existing
