name: Contact Sheet
description: Attach artifact images to the pull request comment
author: miyamo2
branding:
  icon: image
  color: blue

# A description is template text like every other string in this file: GitHub
# scans it for expressions, and none of the contexts a workflow has exist while
# the metadata is being loaded, so one left in prose is not quoted -- it is a
# validation error that fails the whole file, and every job using the action
# with it. An input usually filled from an expression therefore names its
# context path bare here, without the delimiters wrapped around it.
inputs:
  path:
    description: Directory of images to attach.
    required: true
  layout:
    description: >-
      Expression matched against each image's slash-separated path under `path`.
      It filters -- a file it does not match is skipped -- and its named captures
      become that image's metadata for a template to group and order by. The
      names are yours; the action reads none of them. Empty, the default,
      collects every file that looks like an image.
    required: false
    default: ''
  template-files:
    description: >-
      Comma-separated Go text/template entries, each producing one comment, in
      the order given. An entry is a path in the checkout or an https:// URL --
      the ready-made ones live in this action's `templates/` directory. This is
      how you control how many comments a run writes: a body over GitHub's
      65536-character limit is an error, and the fix is another template.
      Defaults to the built-in template.
    required: false
    default: ''
  title:
    description: Heading passed to the template.
    required: false
    default: Contact Sheet
  status:
    description: >-
      Outcome of the job that produced the images, `success` or `failure`.
      Usually an expression over `steps.<id>.outcome`.
    required: false
    default: success
  comment-id:
    description: >-
      Namespaces the comments this action owns, as `<!-- <comment-id>:<template> -->`.
      Two workflows commenting on the same pull request need two different ids,
      or each will delete the other's comments as no longer produced.
    required: false
    default: contact-sheet
  ref-namespace:
    description: >-
      Ref prefix the images are pushed under. Must start with `refs/` and name a
      hierarchy nothing else owns: `refs/heads/*` and `refs/tags/*` are fetched
      by default, which is what this action exists to avoid, and hierarchies git
      or the forge maintains (`refs/notes/*`, `refs/pull/*`, ...) are refused
      too. Checked before the run collects anything.
    required: false
    default: refs/contact-sheet
  row-label:
    description: Header of the first column of a table built by the `table` helper.
    required: false
    default: file name
  image-width:
    description: Width attribute on each `<img>`. `0` omits it.
    required: false
    default: '360'
  sha:
    description: >-
      Commit the images belong to: the one shown in the status line, and the one
      the pull request is resolved from. Empty takes `GITHUB_SHA`, which is right
      for every event except `workflow_run` -- there the job stands on the default
      branch, and this wants an expression over
      `github.event.workflow_run.head_sha`.
    required: false
    default: ''
  pull-number:
    description: Pull request to comment on. Empty resolves it from the commit.
    required: false
    default: ''
  dry-run:
    description: Push nothing, comment nothing, print the body to the log.
    required: false
    default: 'false'
  allow-fork:
    description: >-
      Comment on a pull request from a fork. Skipped by default because a
      `pull_request` run on one has a read-only token that can neither push the
      ref nor write the comment. Set this only where github-token can write to
      the base repository -- an `issue_comment` or `workflow_run` workflow, or a
      PAT -- and only where something has decided that running that pull
      request's code is acceptable. The first of those is checked: a run whose
      token turns out not to be writable skips and says so, rather than
      collecting the images and stopping on the push. The second is not, and
      cannot be.
    required: false
    default: 'false'
  github-token:
    description: >-
      Needs `contents: write` (to push the ref) and `pull-requests: write`.
    required: false
    default: ${{ github.token }}

outputs:
  state:
    description: >-
      `published`, `publish-failed`, `empty`, or `skipped` when the run ended
      without a comment.
    value: ${{ steps.contact-sheet.outputs.state }}
  total:
    description: Number of images in the comment.
    value: ${{ steps.contact-sheet.outputs.total }}
  ref:
    description: Ref the images were pushed to, when state is `published`.
    value: ${{ steps.contact-sheet.outputs.ref }}
  commit:
    description: Commit holding the images, when state is `published`.
    value: ${{ steps.contact-sheet.outputs.commit }}
  comments:
    description: Comma-separated ids of the comments written, in template order.
    value: ${{ steps.contact-sheet.outputs.comments }}
  pull:
    description: Pull request commented on.
    value: ${{ steps.contact-sheet.outputs.pull }}

runs:
  using: composite
  steps:
    - name: Install contact-sheet
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "${ACTION_PATH}/scripts/install.sh"

    - name: Attach the contact sheet
      id: contact-sheet
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CONTACT_SHEET_PATH: ${{ inputs.path }}
        CONTACT_SHEET_LAYOUT: ${{ inputs.layout }}
        CONTACT_SHEET_TEMPLATE_FILES: ${{ inputs.template-files }}
        CONTACT_SHEET_TITLE: ${{ inputs.title }}
        CONTACT_SHEET_STATUS: ${{ inputs.status }}
        CONTACT_SHEET_COMMENT_ID: ${{ inputs.comment-id }}
        CONTACT_SHEET_REF_NAMESPACE: ${{ inputs.ref-namespace }}
        CONTACT_SHEET_ROW_LABEL: ${{ inputs.row-label }}
        CONTACT_SHEET_IMAGE_WIDTH: ${{ inputs.image-width }}
        CONTACT_SHEET_SHA: ${{ inputs.sha }}
        CONTACT_SHEET_PULL_NUMBER: ${{ inputs.pull-number }}
        CONTACT_SHEET_DRY_RUN: ${{ inputs.dry-run }}
        CONTACT_SHEET_ALLOW_FORK: ${{ inputs.allow-fork }}
      run: contact-sheet
